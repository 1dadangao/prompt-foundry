<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>铸辞 · 提示词星图</title>
<meta name="description" content="SFT、RAG、低代码与绘图的提示词星图：黑色场里缓慢漂浮的白色圆形，悬停放大，点开可复制。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============================================================
   铸辞 · PROMPT FOUNDRY — 气泡场版
   1 Tokens 2 Base 3 Controls 4 Shell 5 Field 6 Drawer 7 Toast
   8 Responsive 9 Motion
   ============================================================ */

/* ---------- 1. Tokens ---------- */
:root {
  --bg: #000000;
  --bg-deep: #000000;
  --surface: #0a0a0a;
  --surface-2: #111111;
  --surface-3: #1a1a1a;
  --sidebar: #000000;

  --border: #222222;
  --border-strong: #3a3a3a;
  --border-active: rgba(255, 255, 255, 0.36);

  --text: #ffffff;
  --text-secondary: #c7c7c7;
  --text-muted: #9a9a9a;
  --text-faint: #737373;
  --text-inverse: #000000;

  --accent: #ffffff;
  --accent-hover: #e8e8e8;
  --accent-press: #d2d2d2;
  --accent-soft: rgba(255, 255, 255, 0.10);
  --accent-glow: rgba(255, 255, 255, 0.18);

  --bubble: #ffffff;
  --bubble-ink: #000000;

  --cat-sft: #ffffff;
  --cat-rag: #d4d4d4;
  --cat-lowcode: #a8a8a8;
  --cat-image: #7a7a7a;

  --success: #ffffff;
  --error: #ffffff;
  --error-soft: rgba(255, 255, 255, 0.10);

  --bg-rgb: 0, 0, 0;
  --surface-rgb: 11, 12, 14;
  --accent-rgb: 255, 255, 255;
  --text-rgb: 255, 255, 255;
  --error-rgb: 255, 255, 255;

  --cat-sft-rgb: 255, 255, 255;
  --cat-rag-rgb: 212, 212, 212;
  --cat-lowcode-rgb: 168, 168, 168;
  --cat-image-rgb: 122, 122, 122;

  --font-sans: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'IBM Plex Mono', 'Noto Sans SC', 'PingFang SC', ui-monospace, 'SFMono-Regular', monospace;

  --sidebar-w: 200px;
  --radius-s: 3px;
  --radius: 4px;
  --radius-l: 6px;

  --dur-fast: 120ms;
  --dur: 200ms;
  --dur-slow: 330ms;
  --ease-out: cubic-bezier(.22, .61, .36, 1);
}

[data-cat="sft"] { --cat: var(--cat-sft); --cat-rgb: var(--cat-sft-rgb); }
[data-cat="rag"] { --cat: var(--cat-rag); --cat-rgb: var(--cat-rag-rgb); }
[data-cat="lowcode"] { --cat: var(--cat-lowcode); --cat-rgb: var(--cat-lowcode-rgb); }
[data-cat="image"] { --cat: var(--cat-image); --cat-rgb: var(--cat-image-rgb); }

/* ---------- 2. Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.7;
  letter-spacing: .02em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
body.is-locked { overflow: hidden; }

[hidden] { display: none !important; }
h1, h2, h3, p, pre, figure { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); }

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

::selection { background: rgba(var(--accent-rgb), .26); color: var(--text); }

* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border: 3px solid transparent; background-clip: content-box; border-radius: 6px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

.icon {
  width: 16px; height: 16px; display: block;
  fill: none; stroke: currentColor; stroke-width: 1.5;
  stroke-linecap: round; stroke-linejoin: round;
}
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- 3. Controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 14px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface-2); color: var(--text);
  font-size: 13px; font-weight: 500; line-height: 1; letter-spacing: .02em;
  cursor: pointer;
  transition: background-color .16s ease, border-color .16s ease, color .16s ease, transform .12s ease;
}
.btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { color: var(--text-faint); border-color: var(--border); background: var(--surface); cursor: not-allowed; transform: none; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--text-inverse); font-weight: 600; }
.btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn--primary:active { background: var(--accent-press); border-color: var(--accent-press); }
.btn--danger { color: #000; background: #fff; border-color: #fff; }
.btn--danger:hover { background: #dcdcdc; border-color: #dcdcdc; }
.btn--icon { padding: 0 10px; }

.icon-btn {
  position: relative;
  display: inline-grid; place-items: center;
  width: 32px; height: 32px; padding: 0;
  border: 1px solid transparent; border-radius: var(--radius);
  background: transparent; color: var(--text-muted);
  cursor: pointer;
  transition: color .16s ease, background-color .16s ease, border-color .16s ease, transform .12s ease;
}
.icon-btn:hover { color: var(--accent); background: var(--accent-soft); border-color: var(--border-active); }
.icon-btn:active { transform: scale(.94); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.icon-btn:disabled { color: var(--text-faint); cursor: not-allowed; }
.icon-btn[aria-pressed="true"] { color: var(--accent); }
.icon-btn[aria-pressed="true"] .icon { fill: currentColor; }

.search {
  position: relative;
  display: flex; align-items: center;
  flex: 1 1 auto;
  width: 100%; min-width: 0; max-width: 560px; height: 36px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface-2);
  transition: border-color .16s ease, box-shadow .16s ease, background-color .16s ease;
}
.search:hover { border-color: var(--border-strong); }
.search:focus-within {
  border-color: var(--border-active);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search__icon { position: absolute; left: 11px; color: var(--text-faint); pointer-events: none; }
.search__input {
  flex: 1; min-width: 0; height: 100%;
  padding: 0 82px 0 35px;
  border: 0; background: transparent; outline: none;
  font-size: 13.5px;
}
.search__input::placeholder { color: var(--text-faint); }
.search__input::-webkit-search-decoration,
.search__input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search__kbd {
  position: absolute; right: 8px;
  display: inline-grid; place-items: center;
  min-width: 20px; height: 20px; padding: 0 6px;
  border: 1px solid var(--border); border-radius: var(--radius-s);
  background: var(--surface);
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint);
  pointer-events: none;
}
.search__clear { position: absolute; right: 4px; width: 28px; height: 28px; }
.search.is-filled .search__kbd { display: none; }

.chip {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 8px;
  border: 1px solid var(--border); border-radius: var(--radius-s);
  background: var(--surface-2); color: var(--text-muted);
  font-size: 11.5px; line-height: 1; white-space: nowrap;
}
.chip--cat {
  background: rgba(var(--cat-rgb), .1);
  border-color: rgba(var(--cat-rgb), .28);
  color: var(--cat);
  font-weight: 500;
}
.chip--tag {
  height: 28px; padding: 0 10px;
  cursor: pointer;
  transition: color .16s ease, border-color .16s ease, background-color .16s ease;
}
.chip--tag:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-3); }
.chip--tag:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  max-width: 160px; height: 26px; padding: 0 9px;
  border: 1px solid var(--border-active); border-radius: var(--radius-s);
  background: var(--accent-soft); color: var(--accent);
  font-size: 11.5px; line-height: 1; white-space: nowrap;
  cursor: pointer; overflow: hidden; text-overflow: ellipsis;
}
.filter-chip:hover { background: rgba(var(--accent-rgb), .2); }
.filter-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 4. Shell ---------- */
.shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  grid-template-rows: 60px minmax(0, 1fr);
  height: 100dvh;
  overflow: hidden;
  transition: grid-template-columns .3s var(--ease-out);
}

.sidebar {
  grid-column: 1;
  grid-row: 2;
  position: sticky; top: 0; z-index: 30;
  width: var(--sidebar-w);
  transition: transform .3s var(--ease-out), opacity .18s ease;
  height: 100%;
  display: flex; flex-direction: column;
  padding: 18px 14px 14px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
}
.sidebar-scrim {
  position: fixed; inset: 0; z-index: 65;
  background: rgba(0, 0, 0, .72);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.brand {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%;
  padding: 2px 4px 16px;
}
.brand__mark {
  flex: none;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  color: var(--accent);
  border: 1px solid var(--border-active);
  border-radius: var(--radius);
  background: var(--accent-soft);
  font-size: 14px; font-weight: 600; line-height: 1; letter-spacing: 0;
}

.sidebar__collapse {
  display: grid; place-items: center;
  width: 28px; height: 28px; padding: 0;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--surface-2); color: var(--text-muted);
  cursor: pointer;
  transition: color .16s ease, background-color .16s ease, border-color .16s ease;
}
.sidebar__collapse:hover { color: var(--text); background: var(--surface-3); border-color: var(--border-strong); }
.sidebar__collapse:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sidebar__collapse .icon { transform: rotate(90deg); }

.rail-fab {
  position: fixed; left: 10px; top: 50%; z-index: 40;
  width: 52px; height: 82px; padding: 0;
  display: grid; place-items: center;
  border: 0; border-radius: 999px;
  background: #fff; color: #000;
  font-family: var(--font-sans);
  font-size: 16px; font-weight: 600; letter-spacing: 0;
  cursor: pointer;
  box-shadow: 0 14px 44px rgba(255, 255, 255, .14);
  opacity: 0; visibility: hidden;
  transform: translate(-14px, -50%);
  transition: opacity .25s ease, transform .3s var(--ease-out), visibility .25s;
}
body.rail-collapsed .rail-fab { opacity: 1; visibility: visible; transform: translate(0, -50%); }
.rail-fab:hover { background: #e8e8e8; }
.rail-fab:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.sidebar__rule {
  height: 1px;
  margin: 0 -14px 12px;
  background: var(--border);
}

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav__label {
  margin: 0 0 6px; padding-left: 10px;
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: .12em; color: var(--text-faint);
}
.nav__divider { height: 1px; background: var(--border); margin: 10px 10px; }

.nav-item {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  width: 100%; height: 36px; padding: 0 10px 0 16px;
  border: 1px solid transparent; border-radius: var(--radius-s);
  background: transparent; color: var(--text-secondary);
  font-size: 13.5px; line-height: 1; text-align: left;
  cursor: pointer;
  transition: background-color .16s ease, color .16s ease, border-color .16s ease;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item:active { background: var(--surface-3); }
.nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.nav-item[aria-current="true"] { background: transparent; border-color: transparent; color: var(--text); }
.nav-item[aria-current="true"]::before {
  content: "";
  position: absolute; left: -1px; top: 8px; bottom: 8px;
  width: 2px; border-radius: 2px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.nav-item__dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--cat, var(--text-muted)); }
.nav-item__dot--all { background: transparent; border: 1px solid var(--accent); }
.nav-item__star { flex: none; color: var(--text-faint); }
.nav-item[aria-current="true"] .nav-item__star { color: var(--accent); }
.nav-item__count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px; font-variant-numeric: tabular-nums;
  color: var(--text-faint);
}
.nav-item[aria-current="true"] .nav-item__count { color: var(--accent); }

.stack { margin-top: auto; padding: 18px 4px 0; }
.stack__bar { display: flex; gap: 2px; height: 4px; margin: 8px 0 9px; }
.stack__bar span {
  display: block; height: 100%; flex: 1 1 0; min-width: 2px;
  background: var(--cat); opacity: .85; border-radius: 2px;
  transition: flex-grow .5s var(--ease-out);
}
.stack__legend {
  display: flex; justify-content: space-between; gap: 6px;
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .04em;
  color: var(--text-faint);
}
.sidebar__foot {
  margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 5px;
  font-size: 11px; color: var(--text-faint);
}
.sidebar__foot p { line-height: 1.6; }
.link-btn {
  align-self: flex-start;
  padding: 0; border: 0; background: none;
  color: var(--text-muted); font-size: 11px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
  text-decoration-color: var(--border-strong);
  transition: color .16s ease;
}
.link-btn:hover { color: var(--accent); }
.link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.link-btn:disabled { color: var(--text-faint); cursor: not-allowed; }
.reset-confirm { display: flex; flex-direction: column; gap: 7px; padding: 8px 0 2px; }
.reset-confirm p { color: var(--text-muted); font-size: 10.5px; line-height: 1.5; }
.reset-confirm__row { display: flex; gap: 6px; }
.reset-confirm .btn { height: 32px; padding: 0 10px; font-size: 11.5px; }

.main {
  grid-column: 2;
  grid-row: 2;
  min-width: 0; min-height: 0;
  height: 100%;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Topbar */
.topbar {
  grid-column: 1 / -1;
  grid-row: 1;
  position: sticky; top: 0; z-index: 25;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 560px) minmax(0, 1fr);
  align-items: center; gap: 12px;
  height: 60px; padding: 0 28px; flex: none;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.topbar__left,
.topbar__center,
.topbar__right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.topbar__center { justify-self: stretch; }
.topbar__right { align-self: stretch; }
.topbar__menu { display: none; }
.topbar__meta { display: flex; align-items: center; gap: 8px; margin-left: auto; min-width: 0; }

.refresh-btn {
  flex: none; width: 36px; height: 36px;
  padding: 0;
  color: #fff;
  border: 0;
  background: transparent;
  border-radius: 4px;
}
.refresh-btn:hover { color: #fff; background: transparent; border-color: transparent; opacity: .62; }
.refresh-btn:disabled { color: var(--text-faint); background: transparent; border: 0; cursor: not-allowed; opacity: 1; }
.refresh-btn .icon { width: 18px; height: 18px; }
.refresh-btn.is-spinning .icon { animation: spin .55s var(--ease-out); }
@keyframes spin { to { transform: rotate(360deg); } }
.topbar__count {
  font-family: var(--font-mono);
  font-size: 12px; letter-spacing: .04em;
  color: var(--text-muted); white-space: nowrap;
}
.topbar__new {
  display: inline-flex; flex: none; white-space: nowrap;
  height: 34px; padding: 0 12px;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text);
  font-size: 12.5px; font-weight: 500;
  gap: 6px;
  transition: background-color .16s ease, border-color .16s ease;
}
.topbar__new:hover { background: var(--surface-2); border-color: var(--text-faint); }
.topbar__new:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.topbar__new:active { transform: translateY(1px); }

/* ---------- 5. Field & bubbles ---------- */
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  background: var(--bg);
  isolation: isolate;
}
.bubbles { position: absolute; inset: 0; }

.bubble {
  position: absolute; top: 0; left: 0;
  width: var(--d); height: var(--d);
  margin: 0; padding: 0;
  border: 0; border-radius: 50%;
  background: transparent;
  color: var(--bubble-ink);
  cursor: pointer;
  z-index: 1;
  user-select: none;
  -webkit-user-select: none;
}
.bubble__disc {
  display: grid; place-items: center;
  width: 100%; height: 100%;
  padding: 15%;
  border-radius: 50%;
  background: var(--bubble);
  color: var(--bubble-ink);
  transform: scale(1);
  transition: transform .55s var(--ease-out), box-shadow .55s var(--ease-out);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, .07),
    0 18px 50px rgba(255, 255, 255, .05);
  will-change: auto;
}
.bubble__title {
  font-size: clamp(10.5px, calc(var(--d) * 0.135), 14px);
  font-weight: 600;
  line-height: 1.32;
  letter-spacing: .02em;
  text-align: center;
  color: var(--bubble-ink);
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.bubble:hover, .bubble:focus-visible { z-index: 30; }
.bubble:hover .bubble__disc,
.bubble:focus-visible .bubble__disc {
  transform: scale(1.5);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, .16),
    0 30px 90px rgba(255, 255, 255, .12);
}
.bubble:focus-visible { outline: 2px solid var(--text); outline-offset: 6px; }

@media (hover: none) {
  .bubble:hover .bubble__disc { transform: scale(1); box-shadow: 0 0 0 1px rgba(255, 255, 255, .07), 0 18px 50px rgba(255, 255, 255, .05); }
}

.field-empty {
  position: absolute; left: 0; right: 0; top: 30%;
  transform: translateY(-50%);
  z-index: 5;
  padding: 0 24px;
  text-align: center;
  color: var(--text-muted);
  pointer-events: none;
}
.field-empty > * { pointer-events: auto; }
.field-empty h2 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.field-empty p { max-width: 42ch; margin: 0 auto; font-size: 12.5px; line-height: 1.8; }
.field-empty .btn { margin-top: 18px; }
.field-empty__actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.boot-note {
  position: absolute; left: 50%; top: 30%;
  transform: translate(-50%, -50%);
  z-index: 8;
  width: min(540px, calc(100% - 32px));
  padding: 14px 16px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 12.5px; line-height: 1.85;
}
.boot-note strong { color: var(--text); font-weight: 600; }
.boot-note code {
  padding: 1px 4px; border-radius: 2px;
  background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-mono); font-size: 11.5px;
  overflow-wrap: anywhere;
}

/* ---------- 6. Drawer ---------- */
.drawer-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0, 0, 0, .72);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity .24s ease;
}
.drawer-backdrop.is-open { opacity: 1; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 61;
  width: min(560px, 100vw);
  display: flex; flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -24px 0 64px rgba(0, 0, 0, .6);
  transform: translateX(100%);
  transition: transform .3s var(--ease-out);
  outline: none;
}
.drawer.is-open { transform: none; }
.drawer__head {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
}
.drawer__heading { flex: 1; min-width: 0; }
.drawer__title { margin-top: 10px; font-size: 19px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
.drawer__body { flex: 1; overflow-y: auto; padding: 18px 20px 26px; overscroll-behavior: contain; }
.drawer__meta {
  display: flex; flex-wrap: wrap; gap: 6px 16px;
  margin-bottom: 16px;
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: .04em; color: var(--text-faint);
}
.drawer__summary { margin-bottom: 20px; max-width: 62ch; font-size: 13px; line-height: 1.8; color: var(--text-secondary); }
.drawer__label { margin-bottom: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; color: var(--text-faint); }
.prompt-block {
  max-width: 62ch;
  margin-bottom: 22px; padding: 16px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 13.5px; line-height: 1.8;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.var { color: var(--accent); background: var(--accent-soft); border-radius: 2px; padding: 0 2px; }
.drawer__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
.drawer__source { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted); }
.drawer__source a {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--text-secondary);
  text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px;
}
.drawer__source a:hover { color: var(--accent); }
.drawer__foot {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.drawer__foot .btn--primary { flex: 1 1 auto; }
.drawer__foot .btn[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--border-active);
  background: var(--accent-soft);
}
.drawer__foot .btn[aria-pressed="true"] .icon { fill: currentColor; }
.confirm { display: flex; align-items: center; gap: 10px; width: 100%; flex-wrap: wrap; }
.confirm__text { flex: 1; min-width: 160px; font-size: 12.5px; line-height: 1.6; color: var(--text-secondary); }

/* Forms */
.edit-form { display: flex; flex-direction: column; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
.field__label { font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--text-muted); }
.field__error { font-size: 11.5px; line-height: 1.4; color: var(--error); }
.input, .textarea, .select {
  width: 100%; padding: 9px 11px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface-2); color: var(--text);
  font-size: 13.5px; line-height: 1.6;
  transition: border-color .16s ease, box-shadow .16s ease, background-color .16s ease;
}
.textarea { min-height: 240px; resize: vertical; font-family: var(--font-mono); line-height: 1.75; }
.select { appearance: none; -webkit-appearance: none; cursor: pointer; }
.input::placeholder, .textarea::placeholder { color: var(--text-faint); }
.input:hover, .textarea:hover, .select:hover { border-color: var(--border-strong); }
.input:focus, .textarea:focus, .select:focus {
  outline: none; border-color: var(--border-active); background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--error); }
.select-wrap { position: relative; display: block; }
.select-wrap .select { padding-right: 32px; }
.select-wrap > .icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
.form-meta { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); }

.auth-chip {
  display: inline-flex; align-items: center; flex: none;
  height: 34px; max-width: 112px; padding: 0 10px;
  border: 1px solid var(--border-strong);
  background: transparent; color: var(--text-secondary);
  font-size: 12px; font-weight: 500; letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.auth-chip:hover { color: var(--text); background: var(--surface-2); }
.auth-chip--review { color: var(--text); }
.dest { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dest__opt {
  display: flex; flex-direction: column; gap: 4px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  background: var(--surface-2);
}
.dest__opt:has(input:checked), .dest__opt.is-on {
  border-color: var(--border-active);
  background: var(--surface);
}
.dest__opt input { accent-color: #fff; margin: 0 0 2px; }
.dest__title { font-size: 13px; font-weight: 500; color: var(--text); }
.dest__desc { font-size: 11.5px; line-height: 1.5; color: var(--text-muted); }
.status-pill {
  display: inline-flex; align-items: center;
  height: 20px; padding: 0 7px;
  border: 1px solid var(--border-strong);
  font-size: 11px; color: var(--text-muted); letter-spacing: .04em;
}
.review-list { display: flex; flex-direction: column; gap: 12px; }
.review-item {
  padding: 12px 0 14px;
  border-bottom: 1px solid var(--border);
}
.review-item:last-child { border-bottom: 0; }
.review-item__title { font-size: 14px; font-weight: 500; color: var(--text); margin: 0 0 6px; }
.review-item__meta { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
.review-item__body {
  font-family: var(--font-mono); font-size: 12px; line-height: 1.7;
  color: var(--text-secondary); white-space: pre-wrap;
  max-height: 160px; overflow: auto; margin: 0 0 10px;
}
.review-item__actions { display: flex; gap: 8px; }
.auth-note { font-size: 12.5px; line-height: 1.7; color: var(--text-muted); margin: 0 0 16px; }
.bubble--pending .bubble__disc { box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
.bubble--pending .bubble__title { opacity: .78; }

/* ---------- 6.5 点击圆 → 白色方形放大 ---------- */
.prompt-backdrop {
  position: fixed; inset: 0; z-index: 74;
  background: rgba(0, 0, 0, .58);
  opacity: 0;
  transition: opacity .35s ease;
}
.prompt-backdrop.is-open { opacity: 1; }

.prompt-box {
  position: fixed; z-index: 75;
  display: flex; flex-direction: column;
  background: #fff; color: #000;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 40px 140px rgba(0, 0, 0, .65);
  outline: none;
  transition:
    top 1s var(--ease-out),
    left 1s var(--ease-out),
    width 1s var(--ease-out),
    height 1s var(--ease-out),
    border-radius 1s var(--ease-out);
}
.prompt-box.is-closing { transition-duration: .5s; }
.prompt-box__inner {
  display: flex; flex-direction: column;
  height: 100%; min-height: 0;
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease .45s;
}
.prompt-box.is-expanded .prompt-box__inner { opacity: 1; pointer-events: auto; transition-delay: .55s; }
.prompt-box.is-closing .prompt-box__inner { opacity: 0; transition-delay: 0s; }

.pb-head { position: relative; flex: none; padding: 20px 22px 14px; border-bottom: 1px solid #e6e6e6; }
.pb-cat { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; color: #6a6a6a; }
.pb-title {
  margin-top: 8px; padding-right: 38px;
  font-size: 22px; line-height: 1.35; font-weight: 600; color: #000;
  overflow-wrap: anywhere;
}
.pb-meta {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  margin-top: 8px;
  font-family: var(--font-mono); font-size: 10.5px; color: #6a6a6a;
}
.pb-close {
  position: absolute; top: 14px; right: 14px;
  display: grid; place-items: center;
  width: 32px; height: 32px; padding: 0;
  border: 0; border-radius: 50%;
  background: transparent; color: #000;
  cursor: pointer;
}
.pb-close:hover { background: #efefef; }
.pb-close:focus-visible { outline: 2px solid #000; outline-offset: 2px; }

.pb-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 22px 14px; }
.pb-summary { margin-bottom: 16px; font-size: 13px; line-height: 1.75; color: #333; }
.pb-label { margin-bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: #777; }
.pb-text {
  margin: 0 0 16px; padding: 14px;
  border: 1px solid #e3e3e3; border-radius: 4px;
  background: #f5f5f5; color: #000;
  font-family: var(--font-mono);
  font-size: 12.5px; line-height: 1.8;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.pb-var { background: #000; color: #fff; border-radius: 2px; padding: 0 2px; }
.pb-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.pb-tag {
  height: 26px; padding: 0 9px;
  border: 1px solid #cfcfcf; border-radius: 3px;
  background: #fff; color: #000;
  font-size: 11.5px; cursor: pointer;
}
.pb-tag:hover { background: #f0f0f0; }
.pb-tag:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
.pb-source { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
.pb-source a { color: #000; text-decoration: underline; text-underline-offset: 3px; }
.pb-source a:hover { text-decoration-thickness: 2px; }

.pb-foot { display: flex; gap: 8px; flex: none; padding: 12px 16px; border-top: 1px solid #e6e6e6; }
.pb-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 16px;
  border: 1px solid #000; border-radius: 4px;
  background: #000; color: #fff;
  font-size: 13px; font-weight: 600; line-height: 1;
  cursor: pointer;
}
.pb-btn:hover { background: #1a1a1a; }
.pb-btn:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
.pb-btn--primary { flex: 1; }
.pb-btn--danger { background: #fff; color: #000; }
.pb-btn--danger:hover { background: #efefef; }
.pb-icon {
  display: inline-grid; place-items: center;
  width: 38px; height: 38px; padding: 0;
  border: 1px solid #cfcfcf; border-radius: 4px;
  background: #fff; color: #000;
  cursor: pointer;
}
.pb-icon:hover { background: #f0f0f0; }
.pb-icon:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
.pb-icon[aria-pressed="true"] { background: #000; color: #fff; border-color: #000; }
.pb-icon[aria-pressed="true"] .icon { fill: currentColor; }
.pb-confirm { display: flex; align-items: center; gap: 8px; width: 100%; }
.pb-confirm > span { flex: 1; font-size: 12px; line-height: 1.5; color: #333; }

@media (max-width: 767px) {
  .pb-head { padding: 16px 16px 12px; }
  .pb-title { font-size: 19px; padding-right: 34px; }
  .pb-body { padding: 14px 16px 12px; }
  .pb-foot { padding: 10px 12px; gap: 6px; }
  .pb-btn, .pb-icon { height: 44px; }
  .pb-icon { width: 44px; }
}

/* ---------- 7. Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; z-index: 80;
  display: flex; align-items: center; gap: 9px;
  padding: 9px 15px 9px 11px;
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  background: var(--surface-3); color: var(--text);
  font-size: 12.5px; line-height: 1;
  box-shadow: 0 14px 36px rgba(0, 0, 0, .6);
  transform: translate(-50%, 12px);
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s var(--ease-out);
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
.toast__mark { color: var(--accent); display: inline-grid; place-items: center; }
.toast.is-error { background: #fff; border-color: #fff; color: #000; }
.toast.is-error .toast__mark { color: #000; }

/* ---------- 8. Responsive ---------- */
@media (min-width: 1024px) {
  .shell.is-rail { grid-template-columns: 0 minmax(0, 1fr); }
  .shell.is-rail .sidebar {
    transform: translateX(-100%);
    opacity: 0;
    pointer-events: none;
  }
}

@media (max-width: 1199px) {
  .topbar { padding: 0 22px; }
}

@media (max-width: 1023px) {
  .shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    height: auto;
    min-height: 100dvh;
    overflow: visible;
  }
  .topbar { grid-column: 1; grid-row: 1; display: flex; gap: 8px; }
  .sidebar { grid-column: 1; grid-row: 2; height: 100dvh; }
  .main { grid-column: 1; grid-row: 2; height: auto; min-height: calc(100dvh - 60px); }
  .rail-fab { display: none; }
  .topbar__center { flex: 1; min-width: 0; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 70;
    width: 280px; height: 100dvh;
    transform: translateX(-100%);
    transition: transform .28s var(--ease-out);
  }
  .sidebar.is-open { transform: none; }
  .topbar__menu { display: inline-grid; }
  .topbar__new { display: inline-flex; width: 40px; padding: 0; }
  .topbar__new-label { display: none; }
}

/* 平板：仍让搜索落在页面中线 */
@media (min-width: 768px) and (max-width: 1023px) {
  .topbar__left, .topbar__right { flex: 1 1 0; }
  .topbar__center { flex: 0 0 390px; max-width: 390px; }
}

@media (max-width: 767px) {
  body { overflow-y: auto; }
  .shell { height: auto; min-height: 100dvh; overflow: visible; }
  .main { height: auto; min-height: 100dvh; overflow: visible; }
  .stage { flex: none; height: 1100px; }
  .topbar { height: 56px; padding: 0 14px; gap: 8px; }
  .search { height: 44px; }
  .search__kbd { display: none; }
  .topbar__count { font-size: 11px; }
  .field-empty { top: 240px; transform: none; }
  .boot-note { top: 220px; transform: translateX(-50%); }
  .drawer { width: 100vw; }
  .drawer__foot { flex-wrap: nowrap; }
  .drawer__foot .btn--primary { flex: 1 1 auto; }
  .drawer__foot .btn--icon { flex: 0 0 44px; width: 44px; padding: 0; }
  .drawer__foot .btn__label { display: none; }
  .field-row { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .nav-item { height: 44px; }
  .icon-btn { width: 44px; height: 44px; }
  .search__clear { width: 30px; height: 30px; }
  .topbar__new { width: 44px; height: 44px; padding: 0; }
  .topbar__new-label { display: none; }
  .sidebar__new, .btn { height: 44px; }
  .input, .select { min-height: 44px; }
  .toast { bottom: 18px; max-width: calc(100vw - 28px); }
  body.drawer-open .toast { bottom: 96px; }
  .chip--tag { height: 36px; padding: 0 12px; }
}

@media (max-width: 420px) {
  .search__input { font-size: 13px; }
  .topbar__count { display: none; }
}

/* ---------- 9. Motion ---------- */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bubbleIn { from { opacity: 0; } to { opacity: 1; } }
.bubble { animation: bubbleIn .5s var(--ease-out) both; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    transition-delay: 0ms !important;
  }
  .bubble { animation: none !important; }
  .bubble:hover .bubble__disc { transform: scale(1.5); }
}
</style>

<div class="shell">

  const $ = (sel, root) => (root || document).querySelector(sel);

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

  function icon(name, size) {

    return '<svg class="icon" aria-hidden="true"' + style + '><use href="#i-' + name + '"/></svg>';
  }

  function fmtDate(ts) {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
  }

  function varCount(body) {
    const m = String(body).match(/\{\{[^{}]+\}\}/g);
    return m ? m.length : 0;
  }

  function safeUrl(u) {
    const v = String(u || '').trim();
    return /^https?:\/\//i.test(v) ? v : '';
  }

  function catOf(p) {
    return CAT_BY_ID[p.category] || CATS[0];
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function tokensOf(q) {
    return q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  }

  function haystack(p) {
    return [
      p.title, p.summary, p.body, catOf(p).name,
      (p.tags || []).join(' '),
      p.source && p.source.name ? p.source.name : ''
    ].join(' ').toLowerCase();
  }

  /* ============================================================
     4. 存储
     ============================================================ */
  function safeGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      return JSON.parse(raw);
    } catch (err) { return fallback; }
  }

  function safeSet(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (err) {
      showToast('浏览器未开放本地存储，本次修改不会保存', true);
      return false;

  function makeSeed() {

    return RAW_SEED.map((p, i) => ({
      id: p.id,
      category: p.category,
      title: p.title,
      summary: p.summary,
      tags: p.tags.slice(),
      source: { name: p.source.name, url: p.source.url },
      body: p.body,
      createdAt: now - (RAW_SEED.length - i) * 36e5 * 8,
      updatedAt: now - i * 36e5 * 6
    }));
  }

      if (clean.length) return clean;

  const els = {};

  /* ============================================================
     6. 气泡场

  let fieldW = 0;
  let fieldH = 0;
  let baseD = 92;
  let bubbleMap = new Map();
  let bubbleArr = [];
  let rafId = 0;
  let lastT = 0;
  let resizeTimer = null;

  const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function measureField() {
    if (!els.field) return;
    fieldW = els.field.clientWidth || window.innerWidth;
    fieldH = els.field.clientHeight || (window.innerHeight - 60);
    baseD = computeBase();
  }

  function computeBase() {
    const n = Math.max(library.length, 6);
    const area = fieldW * fieldH * 0.28;
    let d = 2 * Math.sqrt(area / (n * Math.PI));
    const min = fieldW < 600 ? 70 : 82;
    return Math.round(Math.min(128, Math.max(min, d)));
  }

  function diameterFor(title) {
    const f = 0.92 + Math.min(16, title.length) * 0.01;
    return Math.max(54, Math.round(baseD * f));
  }

  function applyPos(b) {
    b.el.style.transform = 'translate3d(' + (b.x - b.r) + 'px,' + (b.y - b.r) + 'px,0)';
  }

  function createBubbleEl(p, b) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'bubble';
    el.dataset.id = p.id;
    el.style.setProperty('--d', b.d + 'px');
    el.setAttribute('aria-label', '打开提示词：' + p.title);
    el.classList.toggle('bubble--pending', !!(p.origin === 'cloud' && p.status === 'pending'));
    el.innerHTML = '<span class="bubble__disc"><span class="bubble__title">' + esc(p.title) + '</span></span>';
    el.addEventListener('pointerenter', () => { b.hovered = true; });
    el.addEventListener('pointerleave', () => { b.hovered = false; });
    el.addEventListener('focus', () => { b.hovered = true; });
    el.addEventListener('blur', () => { b.hovered = false; });
    el.addEventListener('click', () => openPromptBox(p.id, el));
    return el;
  }

  function randomVelocity() {
    const sp = 4 + Math.random() * 6;
    const a = Math.random() * Math.PI * 2;
    return { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp };
  }

  function addBubble(p) {
    const d = diameterFor(p.title);
    const v = randomVelocity();
    const b = {
      id: p.id, d: d, r: d / 2,
      x: 0, y: 0, vx: v.vx, vy: v.vy,
      hovered: false, el: null
    };
    b.el = createBubbleEl(p, b);
    els.bubbles.appendChild(b.el);
    bubbleMap.set(p.id, b);
    bubbleArr = Array.from(bubbleMap.values());
    placeBubble(b);
    applyPos(b);
  }

  function placeBubble(b) {
    const pad = b.r * 1.5 + 4;
    const minX = pad;
    const maxX = Math.max(minX, fieldW - pad);
    const minY = pad;
    const maxY = Math.max(minY, fieldH - pad);
    let best = null;
    let bestScore = -Infinity;

    for (let i = 0; i < 40; i++) {
      const x = minX + Math.random() * (maxX - minX);
      const y = minY + Math.random() * (maxY - minY);
      let nearest = Infinity;
      for (let j = 0; j < bubbleArr.length; j++) {
        const o = bubbleArr[j];
        if (o === b) continue;
        const dx = x - o.x;
        const dy = y - o.y;
        const gap = Math.hypot(dx, dy) - (b.r + o.r + 12);
        if (gap < nearest) nearest = gap;
        if (nearest < 0) break;
      }
      if (nearest > bestScore) {
        bestScore = nearest;
        best = { x: x, y: y };
      }
      if (bestScore > 26) break;
    }

    b.x = best ? best.x : minX;
    b.y = best ? best.y : minY;
  }

  function syncBubbles(list) {
    if (!els.field) return;
    measureField();

    const ids = new Set(list.map(p => p.id));
    let removed = false;
    bubbleMap.forEach((b, id) => {
      if (!ids.has(id)) {
        b.el.remove();
        bubbleMap.delete(id);
        removed = true;
      }
    });
    if (removed) bubbleArr = Array.from(bubbleMap.values());

    list.forEach(p => {
      if (!bubbleMap.has(p.id)) addBubble(p);
    });

    renderEmpty(list);

    if (bubbleArr.length) startLoop();
    else stopLoop();
  }

  function startLoop() {
    if (reducedMotion() || rafId || !bubbleArr.length) return;
    lastT = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function stopLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function tick(now) {
    rafId = requestAnimationFrame(tick);
    if (document.hidden) { lastT = now; return; }
    const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
    lastT = now;
    moveBubbles(dt);
  }

  function moveBubbles(dt) {
    if (!fieldW || !fieldH) return;
    const pad = 8;

    for (let i = 0; i < bubbleArr.length; i++) {
      const b = bubbleArr[i];
      if (b.hovered) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      const edge = b.r * 1.5 + 4;
      if (b.x < edge) { b.x = edge; b.vx = Math.abs(b.vx); }
      if (b.x > fieldW - edge) { b.x = fieldW - edge; b.vx = -Math.abs(b.vx); }
      if (b.y < edge) { b.y = edge; b.vy = Math.abs(b.vy); }
      if (b.y > fieldH - edge) { b.y = fieldH - edge; b.vy = -Math.abs(b.vy); }
    }

    for (let i = 0; i < bubbleArr.length; i++) {
      const a = bubbleArr[i];
      for (let j = i + 1; j < bubbleArr.length; j++) {
        const b = bubbleArr[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const min = a.r + b.r + 8;
        let d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;
        let d = Math.sqrt(d2);
        if (d < 0.001) {
          dx = Math.random() - 0.5;
          dy = Math.random() - 0.5;
          d = Math.hypot(dx, dy) || 1;
        }
        const nx = dx / d;
        const ny = dy / d;
        const overlap = min - d;
        if (a.hovered && b.hovered) continue;
        if (a.hovered) {
          b.x += nx * overlap;
          b.y += ny * overlap;
        } else if (b.hovered) {
          a.x -= nx * overlap;
          a.y -= ny * overlap;
        } else {
          const k = overlap / 2 + 0.2;
          a.x -= nx * k;
          a.y -= ny * k;
          b.x += nx * k;
          b.y += ny * k;
          const p = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
          if (p > 0) {
            a.vx -= p * nx;
            a.vy -= p * ny;
            b.vx += p * nx;
            b.vy += p * ny;
          }
        }
      }
    }

    for (let i = 0; i < bubbleArr.length; i++) {
      const b = bubbleArr[i];
      const edge = b.r * 1.5 + 4;
      b.x = clamp(b.x, edge, Math.max(edge, fieldW - edge));
      b.y = clamp(b.y, edge, Math.max(edge, fieldH - edge));
      applyPos(b);
    }
  }

  function scheduleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(handleResize, 160);
  }

  function handleResize() {
    if (!els.field) return;
    const w = els.field.clientWidth;
    const h = els.field.clientHeight;
    if (!w || !h) return;
    if (!fieldW || !fieldH) { fieldW = w; fieldH = h; baseD = computeBase(); return; }
    const dw = w - fieldW;
    const dh = h - fieldH;
    if (Math.abs(dw) < 24 && Math.abs(dh) < 24) return;
    fieldW = w;
    fieldH = h;
    baseD = computeBase();
    bubbleArr.forEach(b => {
      const p = library.find(x => x.id === b.id);
      if (!p) return;
      const d = diameterFor(p.title);
      b.d = d;
      b.r = d / 2;
      b.el.style.setProperty('--d', d + 'px');
      const edge = b.r * 1.5 + 4;
      b.x = clamp(b.x + dw / 2, edge, Math.max(edge, fieldW - edge));
      b.y = clamp(b.y + dh / 2, edge, Math.max(edge, fieldH - edge));
      applyPos(b);
    });
  }

  function renderEmpty(list) {
    if (!els.empty) return;
    if (list.length) {

  /* ============================================================
     7. 渲染
     ============================================================ */
  function batchOf(list) {
    if (list.length <= BATCH) return list;
    const start = ((batchOffset % list.length) + list.length) % list.length;
    const out = [];
    for (let i = 0; i < BATCH; i++) out.push(list[(start + i) % list.length]);
    return out;
  }

  function renderAll() {
    const all = getVisible();
    const sig = state.view + '|' + (state.tag || '') + '|' + state.query.trim();
    if (sig !== lastFilterSig) {
      lastFilterSig = sig;
      batchOffset = 0;
    }
    const list = batchOf(all);
    renderNav();
    renderMeta(all, list);
    syncBubbles(list);
  }

  function renderNav() {
    $$('.nav-item').forEach(btn => {
      if (btn.dataset.view === state.view) btn.setAttribute('aria-current', 'true');
      else btn.removeAttribute('aria-current');
    });
  }

  function resetBubbles() {
    stopLoop();
    bubbleArr.forEach(b => b.el.remove());
    bubbleMap = new Map();
    bubbleArr = [];
  }

  function refreshBatch() {
    const all = getVisible();
    if (!all.length) { showToast('没有可换的提示词', true); return; }
    if (all.length > BATCH) batchOffset = (batchOffset + BATCH) % all.length;
    else batchOffset = 0;
    resetBubbles();
    renderAll();
    if (els.refreshBtn) {
      els.refreshBtn.classList.remove('is-spinning');
      void els.refreshBtn.offsetWidth;
      els.refreshBtn.classList.add('is-spinning');
      setTimeout(() => els.refreshBtn.classList.remove('is-spinning'), 650);
    }
    showToast(all.length > BATCH ? '换一批 · 显示 ' + BATCH + ' 条' : '已重新排布');
  }

  function renderMeta(all, list) {
    els.viewCount.textContent = all.length > BATCH
      ? list.length + ' / ' + all.length + ' 条'
      : all.length + ' 条';
    if (els.refreshBtn) els.refreshBtn.disabled = all.length === 0;
    if (state.tag) {
      els.activeTag.hidden = false;
      els.activeTag.textContent = '#' + state.tag + '  ×';
      els.activeTag.setAttribute('aria-label', '清除标签筛选 ' + state.tag);
    } else {
      els.activeTag.hidden = true;
      els.activeTag.textContent = '';

  let toastTimer = null;

  function showToast(msg, isError) {
    const t = els.toast;
    els.toastText.textContent = msg;
    if (els.toastMark) els.toastMark.innerHTML = icon(isError ? 'alert' : 'check');
    t.classList.toggle('is-error', !!isError);
    t.classList.add('is-visible');

  }

  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(text); return true; } catch (err) { /* fallback */ }
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }

  let drawerState = null;

  function lockBody() { document.body.classList.add('is-locked'); }
  function unlockBody() {
    if (!drawerState && !els.sidebar.classList.contains('is-open')) document.body.classList.remove('is-locked');

  function openDrawer(mode, id) {
    clearTimeout(closeTimer);
    bubbleArr.forEach(b => { b.hovered = false; });
    if (!drawerState) drawerState = { mode: mode, id: id, returnFocus: document.activeElement };
    else { drawerState.mode = mode; drawerState.id = id; }

    if (els.drawer.hidden) {
      els.drawer.hidden = false;
      els.backdrop.hidden = false;
      void els.drawer.offsetWidth;
    }
    renderDrawer();
    lockBody();
    document.body.classList.add('drawer-open');

    requestAnimationFrame(() => {
      els.drawer.classList.add('is-open');
      els.backdrop.classList.add('is-open');
      requestAnimationFrame(() => {
        const target = els.drawer.querySelector('[data-autofocus]');
        if (target) target.focus({ preventScroll: true });
        else els.drawer.focus({ preventScroll: true });
      });
    });
  }

  function closeDrawer() {
    if (!drawerState) return;
    const back = drawerState.returnFocus;
    drawerState = null;
    els.drawer.classList.remove('is-open');
    els.backdrop.classList.remove('is-open');
    document.body.classList.remove('drawer-open');
    unlockBody();
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => {
      if (!drawerState) { els.drawer.hidden = true; els.backdrop.hidden = true; }
    }, 320);
    if (back && typeof back.focus === 'function' && document.contains(back)) {
      back.focus({ preventScroll: true });
    }
  }

    const p = drawerState.id ? findPrompt(drawerState.id) : null;
    if (drawerState.mode === 'edit') renderEditor(p);

  async function saveEditor() {
    const form = $('#editForm');
    if (!form) return;
    const data = new FormData(form);
    const title = String(data.get('title') || '').trim();
    const body = String(data.get('body') || '').trim();
    let ok = true;
    showFieldError('title', !title);
    if (!title) ok = false;
    showFieldError('body', !body);
    if (!body) ok = false;
    if (!ok) {
      (title ? $('#f-body', form) : $('#f-title', form)).focus();
      return;
    }

    const id = String(data.get('id') || '');
    const tags = String(data.get('tags') || '').split(/[,，]/).map(s => s.trim()).filter(Boolean).slice(0, 8);
    const now = Date.now();
    const existing = id ? findPrompt(id) : null;
    const dest = existing
      ? (existing.origin === 'cloud' ? 'cloud' : 'local')
      : String(data.get('dest') || 'local');

    const payload = {
      category: String(data.get('category') || 'sft'),
      title: title,
      summary: String(data.get('summary') || '').trim(),
      tags: tags,
      body: body,
      source_name: String(data.get('sourceName') || '').trim() || '本站整理',
      source_url: String(data.get('sourceUrl') || '').trim()
    };

    if (dest === 'cloud') {
      if (!sb || !cloudUser) { showToast('请先登录后再提交到云端', true); return; }
      const row = Object.assign({}, payload, {
        author_id: cloudUser.id,
        status: isAdmin() ? 'approved' : 'pending'
      });
      let error;
      if (existing && existing.origin === 'cloud') {
        const upd = Object.assign({}, payload);
        if (existing.status === 'pending') upd.status = 'pending';
        const res = await sb.from('prompts').update(upd).eq('id', existing.id);
        error = res.error;
      } else {
        const res = await sb.from('prompts').insert(row).select('*').single();
        error = res.error;
      }
      if (error) { showToast('保存失败：' + error.message, true); return; }
      await loadCloudPrompts();
      closeDrawer();
      renderAccount();
      renderAll();
      if (existing) showToast('已保存修改');
      else showToast(isAdmin() ? '已发布到云端' : '已提交，等待审核');
      return;
    }

    const next = {
      id: existing ? existing.id : 'u-' + now.toString(36),
      category: payload.category,
      title: title,
      summary: payload.summary,
      tags: tags,
      body: body,
      source: { name: payload.source_name, url: payload.source_url },
      createdAt: existing ? existing.createdAt : now,
      updatedAt: now
    };

    if (existing) library = library.map(p => p.id === next.id ? next : p);
    else library.unshift(next);

    safeSet(STORE.lib, library);
    closeDrawer();
    renderAll();
    showToast(existing ? '已保存修改' : '已新建提示词');
  }

  function confirmDelete() {
    els.drawerFoot.innerHTML =
      '<div class="confirm">' +
        '<span class="confirm__text">删除后不可恢复，确定吗？</span>' +
        '<button class="btn" type="button" data-action="delete-cancel">取消</button>' +
        '<button class="btn btn--danger" type="button" data-action="delete-confirm">删除</button>' +
      '</div>';
    const btn = els.drawerFoot.querySelector('[data-action="delete-confirm"]');
    if (btn) btn.focus();
  }

  async function doDelete() {
    const id = drawerState && drawerState.id;
    const p = findPrompt(id);
    if (!p) return;
    const ok = await deletePrompt(p);
    if (!ok) return;
    closeDrawer();
    renderAccount();
    renderAll();
    showToast('已删除');
  }

  /* ============================================================
     10.5 白色方形放大框
     ============================================================ */
  function boxFootHTML(p) {
    const fav = favorites.has(p.id);
    let html = '<button class="pb-btn pb-btn--primary" type="button" data-box-action="copy">' + icon('copy') + '复制全文</button>' +
      '<button class="pb-icon" type="button" data-box-action="fav" aria-pressed="' + fav + '" aria-label="' + (fav ? '取消收藏' : '收藏') + '">' + icon('star') + '</button>';
    if (canMutate(p)) {
      html += '<button class="pb-icon" type="button" data-box-action="edit" aria-label="编辑">' + icon('edit') + '</button>' +
        '<button class="pb-icon" type="button" data-box-action="delete" aria-label="删除">' + icon('trash') + '</button>';
    }
    return html;
  }

  function renderPromptBox(p) {
    const cat = catOf(p);
    const src = safeUrl(p.source && p.source.url);
    return '<div class="prompt-box__inner" inert>' +
      '<header class="pb-head">' +
        '<p class="pb-cat">' + esc(cat.name) + '</p>' +
        '<h2 class="pb-title" id="pbTitle">' + esc(p.title) + '</h2>' +
        '<div class="pb-meta">' +
          '<span>更新 ' + fmtDate(p.updatedAt) + '</span>' +
          '<span>' + p.body.length + ' 字符</span>' +
          '<span>' + varCount(p.body) + ' 个变量</span>' +
        '</div>' +
        '<button class="pb-close" type="button" data-box-action="close" aria-label="关闭">' + icon('x', 18) + '</button>' +
      '</header>' +
      '<div class="pb-body">' +
        '<p class="pb-summary">' + esc(p.summary) + '</p>' +
        '<p class="pb-label">提示词</p>' +
        '<pre class="pb-text">' + esc(p.body).replace(/\{\{([^{}]+)\}\}/g, '<span class="pb-var">{{$1}}</span>') + '</pre>' +
        '<p class="pb-label">标签</p>' +
        '<div class="pb-tags">' +
          (p.tags || []).map(t => '<button class="pb-tag" type="button" data-box-tag="' + escAttr(t) + '">#' + esc(t) + '</button>').join('') +
        '</div>' +
        '<p class="pb-label">来源</p>' +
        '<div class="pb-source">' +
          (src
            ? '<a href="' + escAttr(src) + '" target="_blank" rel="noopener">' + esc(p.source.name || src) + icon('external', 12) + '</a>'
            : '<span>' + esc((p.source && p.source.name) || '本站整理') + '</span>') +
        '</div>' +
      '</div>' +
      '<footer class="pb-foot">' + boxFootHTML(p) + '</footer>' +
    '</div>';
  }

  function openPromptBox(id, sourceEl) {
    if (boxState) return;
    const p = library.find(x => x.id === id);
    if (!p || !els.promptBox) return;

    const disc = sourceEl ? sourceEl.querySelector('.bubble__disc') : null;
    const startRect = (disc || sourceEl || els.field).getBoundingClientRect();
    const baseRect = sourceEl ? sourceEl.getBoundingClientRect() : startRect;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const mobile = w < 768;
    const side = Math.min(
      Math.max(300, w * (mobile ? 0.88 : 0.58)),
      h * (mobile ? 0.9 : 0.72),
      720,
      w - 24,
      h - 24
    );
    const finalRect = { top: (h - side) / 2, left: (w - side) / 2, width: side, height: side };

    boxState = {
      id: id,
      prompt: p,
      sourceEl: sourceEl,
      baseRect: { top: baseRect.top, left: baseRect.left, width: baseRect.width, height: baseRect.height },
      returnFocus: sourceEl || document.activeElement
    };

    stopLoop();
    bubbleArr.forEach(b => { b.hovered = false; });
    if (sourceEl) sourceEl.style.opacity = '0';

    els.promptBox.innerHTML = renderPromptBox(p);
    els.promptBox.hidden = false;
    els.promptBackdrop.hidden = false;
    els.promptBox.style.top = startRect.top + 'px';
    els.promptBox.style.left = startRect.left + 'px';
    els.promptBox.style.width = startRect.width + 'px';
    els.promptBox.style.height = startRect.height + 'px';
    els.promptBox.style.borderRadius = '50%';
    void els.promptBox.offsetWidth;

    requestAnimationFrame(() => {
      if (!boxState) return;
      els.promptBackdrop.classList.add('is-open');
      els.promptBox.style.top = finalRect.top + 'px';
      els.promptBox.style.left = finalRect.left + 'px';
      els.promptBox.style.width = finalRect.width + 'px';
      els.promptBox.style.height = finalRect.height + 'px';
      els.promptBox.style.borderRadius = '4px';
      els.promptBox.classList.add('is-expanded');
    });

    lockBody();
    els.promptBox.focus({ preventScroll: true });

    setTimeout(() => {
      if (!boxState) return;
      const inner = els.promptBox.querySelector('.prompt-box__inner');
      if (inner) inner.removeAttribute('inert');
      const close = els.promptBox.querySelector('.pb-close');
      if (close) close.focus({ preventScroll: true });
    }, 1000);
  }

  function finishBoxClose(st) {
    els.promptBox.hidden = true;
    els.promptBackdrop.hidden = true;
    els.promptBox.classList.remove('is-closing');
    els.promptBox.innerHTML = '';
    els.promptBox.style.cssText = '';
    if (st.sourceEl) st.sourceEl.style.opacity = '';
    unlockBody();
    startLoop();
    const target = st.returnFocus && document.contains(st.returnFocus) ? st.returnFocus
      : (st.sourceEl && document.contains(st.sourceEl) ? st.sourceEl : null);
    if (target) target.focus({ preventScroll: true });
  }

  function closePromptBox(immediate) {
    if (!boxState) return;
    const st = boxState;
    boxState = null;
    const inner = els.promptBox.querySelector('.prompt-box__inner');
    if (inner) inner.setAttribute('inert', '');
    els.promptBox.classList.remove('is-expanded');
    els.promptBox.classList.add('is-closing');
    els.promptBackdrop.classList.remove('is-open');

    if (immediate) { finishBoxClose(st); return; }

    els.promptBox.style.top = st.baseRect.top + 'px';
    els.promptBox.style.left = st.baseRect.left + 'px';
    els.promptBox.style.width = st.baseRect.width + 'px';
    els.promptBox.style.height = st.baseRect.height + 'px';
    els.promptBox.style.borderRadius = '50%';
    setTimeout(() => finishBoxClose(st), 520);
  }

  function showBoxConfirm(p) {
    const foot = els.promptBox.querySelector('.pb-foot');
    if (!foot) return;
    foot.innerHTML = '<div class="pb-confirm">' +
      '<span>删除后不可恢复，确定吗？</span>' +
      '<button class="pb-btn pb-btn--danger" type="button" data-box-action="cancel-delete">取消</button>' +
      '<button class="pb-btn" type="button" data-box-action="delete-confirm">删除</button>' +
    '</div>';
  }

  function handleBoxAction(action) {
    if (!boxState) return;
    const p = boxState.prompt;
    if (action === 'close') { closePromptBox(); return; }
    if (action === 'copy') {
      copyText(p.body).then(ok => {
        if (!ok) { showToast('复制失败，请手动选择文本或检查剪贴板权限', true); return; }
        showToast('已复制到剪贴板');
        const btn = els.promptBox.querySelector('[data-box-action="copy"]');
        if (btn) {
          const old = btn.innerHTML;
          btn.innerHTML = icon('check') + '已复制';
          setTimeout(() => { if (btn) btn.innerHTML = old; }, 1200);
        }
      });
      return;
    }
    if (action === 'fav') {
      toggleFav(p.id, null);
      const btn = els.promptBox.querySelector('[data-box-action="fav"]');
      if (btn) {
        const on = favorites.has(p.id);
        btn.setAttribute('aria-pressed', String(on));
        btn.setAttribute('aria-label', on ? '取消收藏' : '收藏');
      }
      return;
    }
    if (action === 'edit') {
      if (!canMutate(p)) { showToast('这条不能编辑', true); return; }
      closePromptBox(true);
      openDrawer('edit', p.id);
      return;
    }
    if (action === 'delete') { showBoxConfirm(p); return; }
    if (action === 'cancel-delete') {
      const foot = els.promptBox.querySelector('.pb-foot');
      if (foot) foot.innerHTML = boxFootHTML(p);
      return;
    }
    if (action === 'delete-confirm') {
      deletePrompt(p).then(ok => {
        if (!ok) return;
        closePromptBox(true);
        renderAccount();
        renderAll();
        showToast('已删除');
      });
    }
  }

  /* ============================================================
     11. 侧栏 / 抽屉状态
     ============================================================ */
  function focusSearch() {
    els.searchInput.focus();
    els.searchInput.select();
  }

  function setRail(on, persist) {
    railCollapsed = !!on;
    els.shell.classList.toggle('is-rail', railCollapsed);
    document.body.classList.toggle('rail-collapsed', railCollapsed);
    if (els.collapseBtn) els.collapseBtn.setAttribute('aria-expanded', String(!railCollapsed));
    if (els.railFab) els.railFab.setAttribute('aria-expanded', String(!railCollapsed));
    if (persist) {
      safeSet(STORE.rail, railCollapsed);
      if (window.innerWidth >= 1024) {
        setTimeout(() => {
          if (railCollapsed && els.railFab) els.railFab.focus({ preventScroll: true });
          else if (!railCollapsed && els.collapseBtn) els.collapseBtn.focus({ preventScroll: true });
        }, 320);
      }
    }
  }

  function toggleSidebar(open) {
    const shouldOpen = typeof open === 'boolean' ? open : !els.sidebar.classList.contains('is-open');
    els.sidebar.classList.toggle('is-open', shouldOpen);
    els.sidebarScrim.hidden = !shouldOpen;
    els.menuBtn.setAttribute('aria-expanded', String(shouldOpen));
    if (shouldOpen) lockBody(); else unlockBody();
  }

  function applyQuery(value) {
    els.searchInput.value = value;
    els.searchWrap.classList.toggle('is-filled', !!value);
    els.searchClear.hidden = !value;
    state.query = value;
    renderAll();
  }

  /* ============================================================
     12. 事件
     ============================================================ */
  function bind() {
    $$('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        state.view = btn.dataset.view;
        if (state.view !== 'all' && state.view !== 'fav') state.tag = null;
        renderAll();
        toggleSidebar(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    els.menuBtn.addEventListener('click', () => toggleSidebar());
    els.sidebarScrim.addEventListener('click', () => toggleSidebar(false));

    els.collapseBtn.addEventListener('click', () => {
      if (window.innerWidth < 1024) { toggleSidebar(false); return; }
      setRail(true, true);
    });

    els.railFab.addEventListener('click', () => {
      setRail(false, true);
    });

    els.newBtnTop.addEventListener('click', () => requestNew());
    if (els.accountBtn) {
      els.accountBtn.addEventListener('click', () => openDrawer(cloudUser ? 'account' : 'auth', null));
    }
    if (els.reviewBtn) {
      els.reviewBtn.addEventListener('click', () => openDrawer('review', null));
    }

    let searchTimer = null;
    els.searchInput.addEventListener('input', (e) => {
      const value = e.target.value;
      els.searchWrap.classList.toggle('is-filled', !!value);
      els.searchClear.hidden = !value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.query = value.trim();
        renderAll();
      }, 120);
    });
    els.searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { applyQuery(''); els.searchInput.blur(); }
    });
    els.searchClear.addEventListener('click', () => { applyQuery(''); els.searchInput.focus(); });

    els.activeTag.addEventListener('click', () => {
      state.tag = null;
      renderAll();
    });

    els.refreshBtn.addEventListener('click', refreshBatch);

    els.empty.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-empty]');
      if (!btn) return;
      const action = btn.dataset.empty;
      if (action === 'new') { openDrawer('edit', null); return; }
      if (action === 'all') { state.view = 'all'; state.tag = null; renderAll(); return; }
      if (action === 'reset') { resetLibrary(); return; }
      state.tag = null;
      applyQuery('');
    });

    els.backdrop.addEventListener('click', closeDrawer);
    els.promptBackdrop.addEventListener('click', () => closePromptBox());
    els.promptBox.addEventListener('click', (e) => {
      const tagEl = e.target.closest('[data-box-tag]');
      if (tagEl) {
        state.view = 'all';
        state.tag = tagEl.dataset.boxTag;
        closePromptBox(true);
        renderAll();
        return;
      }
      const actionEl = e.target.closest('[data-box-action]');
      if (!actionEl) return;
      e.preventDefault();
      handleBoxAction(actionEl.dataset.boxAction);
    });
    els.promptBox.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const nodes = $$('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])', els.promptBox)
        .filter(el => el.offsetParent !== null);
      if (!nodes.length) { e.preventDefault(); return; }
      const first = nodes[0];
      const last = nodes[nodes.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    els.drawer.addEventListener('click', (e) => {
      const tagEl = e.target.closest('[data-tag]');
      if (tagEl) {
        state.view = 'all';
        state.tag = tagEl.dataset.tag;
        closeDrawer();
        renderAll();
        return;
      }
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const p = drawerState && drawerState.id ? findPrompt(drawerState.id) : null;

      if (action === 'close') { closeDrawer(); }
      else if (action === 'fav' && p) {
        toggleFav(p.id, null);
        renderView(p);
      }
      else if (action === 'copy' && p) {
        copyText(p.body).then(ok => {
          if (!ok) { showToast('复制失败，请手动选择文本或检查剪贴板权限', true); return; }
          showToast('已复制到剪贴板');
          const btn = els.drawerFoot.querySelector('[data-action="copy"]');
          if (btn) {
            const old = btn.innerHTML;
            btn.innerHTML = icon('check') + '已复制';
            setTimeout(() => { btn.innerHTML = old; }, 1200);
          }
        });
      }
      else if (action === 'edit' && p) {
        if (!canMutate(p)) { showToast('这条不能编辑', true); return; }
        openDrawer('edit', p.id);
      }
      else if (action === 'delete') {
        if (!canMutate(p)) { showToast('这条不能删除', true); return; }
        confirmDelete();
      }
      else if (action === 'delete-cancel') { if (p) renderView(p); }
      else if (action === 'delete-confirm') { doDelete(); }
      else if (action === 'save') { saveEditor(); }
      else if (action === 'auth-login') { submitAuth('login'); }
      else if (action === 'auth-signup') { submitAuth('signup'); }
      else if (action === 'auth-logout') { signOut(); }
      else if (action === 'review-approve') { reviewPrompt(actionEl.dataset.id, 'approved'); }
      else if (action === 'review-reject') { reviewPrompt(actionEl.dataset.id, 'rejected'); }
    });

    els.drawer.addEventListener('submit', (e) => {
      e.preventDefault();
      saveEditor();
    });

    document.addEventListener('keydown', (e) => {
      if (boxState) {
        if (e.key === 'Escape') { e.preventDefault(); closePromptBox(); }
        return;
      }
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const typing = /INPUT|TEXTAREA|SELECT/.test(tag) || (document.activeElement && document.activeElement.isContentEditable);

      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        focusSearch();
        return;
      }
      if (e.key === '/' && !typing) {
        e.preventDefault();
        focusSearch();
        return;
      }
      if (e.key === 'Escape') {
        if (drawerState) { closeDrawer(); return; }
        if (els.sidebar.classList.contains('is-open')) { toggleSidebar(false); return; }
      }
      if (e.key === 'Tab' && drawerState) {
        const nodes = $$('a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])', els.drawer)
          .filter(el => el.offsetParent !== null);
        if (!nodes.length) return;
        const first = nodes[0];
        const last = nodes[nodes.length - 1];
        if (e.shiftKey && (document.activeElement === first || document.activeElement === els.drawer)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    const mq = window.matchMedia('(min-width: 1024px)');
    const handler = () => { if (mq.matches) toggleSidebar(false); };
    if (mq.addEventListener) mq.addEventListener('change', handler);
    else if (mq.addListener) mq.addListener(handler);

    if ('ResizeObserver' in window) {
      new ResizeObserver(scheduleResize).observe(els.field);
    } else {
      window.addEventListener('resize', scheduleResize);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopLoop();
      else startLoop();
    });
  }

  function resetLibrary() {
    library = makeSeed();
    favorites = new Set();
    safeSet(STORE.lib, library);
    safeSet(STORE.fav, []);
    safeSet(STORE.seed, SEED_VERSION);
    state = { view: 'all', tag: null, query: '' };
    batchOffset = 0;
    lastFilterSig = '';
    bubbleMap.forEach(b => b.el.remove());
    bubbleMap = new Map();
    bubbleArr = [];
    applyQuery('');
    showToast('已恢复 34 条示例');
  }

  /* ============================================================
     13. 启动
     ============================================================ */
  async function _initApp() {
    els.shell = $('.shell');
    els.sidebar = $('#sidebar');
    els.sidebarScrim = $('#sidebarScrim');
    els.menuBtn = $('#menuBtn');
    els.collapseBtn = $('#collapseBtn');
    els.railFab = $('#railFab');
    els.newBtnTop = $('#newBtnTop');
    els.accountBtn = $('#accountBtn');
    els.reviewBtn = $('#reviewBtn');
    els.field = $('#stage');
    els.bubbles = $('#bubbles');
    els.empty = $('#empty');
    els.searchWrap = $('#searchWrap');
    els.searchInput = $('#searchInput');
    els.searchClear = $('#searchClear');
    els.refreshBtn = $('#refreshBtn');
    els.viewCount = $('#viewCount');
    els.activeTag = $('#activeTag');
    els.drawer = $('#drawer');
    els.drawerCat = $('#drawerCat');
    els.drawerTitle = $('#drawerTitle');
    els.drawerBody = $('#drawerBody');
    els.drawerFoot = $('#drawerFoot');
    els.backdrop = $('#backdrop');
    els.promptBackdrop = $('#promptBackdrop');
    els.promptBox = $('#promptBox');
    els.toast = $('#toast');
    els.toastMark = $('#toastMark');
    els.toastText = $('#toastText');

    library = loadLibrary();
    favorites = new Set((safeGet(STORE.fav, []) || []).filter(Boolean));

    setRail(!!safeGet(STORE.rail, false), false);
    bind();
    renderAll();

    const bootNote = $('#bootNote');
    if (bootNote) bootNote.remove();

    sb = initSupabase();
    if (sb) {
      sb.auth.onAuthStateChange(async (event, session) => {
        cloudUser = session && session.user ? session.user : null;
        await refreshCloud();
      });
      const { data } = await sb.auth.getSession();
      cloudUser = data && data.session && data.session.user ? data.session.user : null;
      await refreshCloud();
    } else {
      renderAccount();
    }
  }

  function boot() {
    Promise.resolve(_initApp()).catch((err) => {
      console.error('[铸辞] 初始化失败', err);
      const note = document.getElementById('bootNote');
      if (note) note.hidden = false;
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
